<div class="d-flex justify-content-between align-items-center mb-4">

    <div>
        <h2 class="mb-0">{{ titulo }}</h2>

        {% if subtitulo %}
            <small class="text-muted">
                {{ subtitulo }}
            </small>
        {% endif %}
    </div>

    {% if botao_url %}
        <a href="{{ botao_url }}" class="btn btn-success">
            {{ botao_texto }}
        </a>
    {% endif %}

</div>

<hr>
